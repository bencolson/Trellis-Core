name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Swift (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    # TrellisCore has no Apple-only dependencies; this keeps it that way.
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  reference:
    name: colour-science reference fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Fixtures match colour-science
        run: |
          python research/reference/colorspace_reference.py --check
          python research/reference/deltaE_reference.py --check
          python research/reference/bake_reference.py --check
          python research/reference/ocio_bake_check.py
          python research/reference/gamut_reference.py --check
